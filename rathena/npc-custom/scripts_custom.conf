// ===================== Legion server cap: no rebirth, no transcendent classes (ST01 / G10, owner 2026-11-15) =====================
// The server caps at the 2nd job: no High Novice, no High 1st, no transcendent 2nd job for anyone (bots and humans),
// no 3rd or 4th job. This file is loaded last (npc/re/scripts_main.conf imports npc/scripts_custom.conf at its end),
// so these delnpc lines remove entries npc/re/scripts_jobs.conf already added.
// (delnpc in conf/import/map_conf.txt would NOT work: map_conf is read before the NPC lists are loaded.)
// Kept for characters reborn before ST01 (they keep their class and finish their path): the High 1st job NPCs
// (npc/re/jobs/1-1), the transcendent 2nd-job NPCs (npc/jobs/2-1a, 2-2a, placed on the valkyrie map), and the way into
// that map (npc/custom-local/valkyrie_norebirth.txt: the stock valkyrie.txt minus the rebirth pieces).
// Kept: 1st/2nd jobs, and the 1st/2nd-tier expanded classes (Taekwon/Star Gladiator/Soul Linker, Ninja/Kagerou/Oboro,
// Gunslinger/Rebellion, Super Novice). Mounted over /rathena/npc/scripts_custom.conf by docker-compose.yml.
// - 3-1
delnpc: npc/re/jobs/3-1/archbishop.txt
delnpc: npc/re/jobs/3-1/mechanic.txt
delnpc: npc/re/jobs/3-1/ranger.txt
delnpc: npc/re/jobs/3-1/rune_knight.txt
delnpc: npc/re/jobs/3-1/warlock.txt
delnpc: npc/re/jobs/3-1/guillotine_cross.txt
// - 3-2
delnpc: npc/re/jobs/3-2/genetic.txt
delnpc: npc/re/jobs/3-2/minstrel.txt
delnpc: npc/re/jobs/3-2/royal_guard.txt
delnpc: npc/re/jobs/3-2/shadow_chaser.txt
delnpc: npc/re/jobs/3-2/sorcerer.txt
delnpc: npc/re/jobs/3-2/sura.txt
delnpc: npc/re/jobs/3-2/wanderer.txt
// - Expanded Super Novice (3rd-job tier)
delnpc: npc/re/jobs/novice/supernovice_ex.txt
// - Doram 4th job (Spirit Handler)
delnpc: npc/re/jobs/doram/spirit_handler.txt
// - Rebirth (ST01 / G10): the stock valkyrie.txt is unloaded and replaced by the copy without the rebirth pieces
//   (Valkyrie rebirth NPC, Metheus Sylphe's paid Book of Ymir entry, Book of Ymir rebirth branch).
delnpc: npc/jobs/valkyrie.txt
npc: npc/custom-local/valkyrie_norebirth.txt

// ===================== Market crier: server-wide notices, no character taking part (EC44, WP7) =====================
// Floating NPC MarketCrier: announces rows of legion_notice (rathena/sql/legion_notice.sql) at most once a minute.
// Written by tools/system/crier.py only when tuning.json market_broadcast_on is true.
npc: npc/custom-local/legion_crier.txt
