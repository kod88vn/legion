// ===================== Legion server cap: no rebirth, no transcendent classes (ST01 / G10, owner 2026-11-15) =====================
// "cap server at trans class": the highest class anyone (bots and humans) can reach on this server is the
// transcendent 2nd job (Lord Knight ... Gypsy). The 3rd-job, Expanded Super Novice and 4th-job (Doram Spirit
// Handler) job-change quests are unloaded here. This file is loaded last (npc/re/scripts_main.conf imports
// npc/scripts_custom.conf at its end), so these delnpc lines remove entries npc/re/scripts_jobs.conf already added.
// (delnpc in conf/import/map_conf.txt would NOT work: map_conf is read before the NPC lists are loaded.)
// Kept: 1st/2nd jobs, transcendent 2nd jobs (npc/jobs/2-1a, 2-2a; for characters reborn before ST01), and the
// 1st/2nd-tier expanded classes (Taekwon/Star Gladiator/Soul Linker, Ninja/Kagerou/Oboro, Gunslinger/Rebellion,
// Super Novice). Mounted over /rathena/npc/scripts_custom.conf by docker-compose.yml.
// - 3-1
delnpc: npc/re/jobs/3-1/archbishop.txt
delnpc: npc/re/jobs/3-1/mechanic.txt
delnpc: npc/re/jobs/3-1/ranger.txt
delnpc: npc/re/jobs/3-1/rune_knight.txt
delnpc: npc/re/jobs/3-1/warlock.txt
delnpc: npc/re/jobs/3-1/guillotine_cross.txt
// - 3-2
delnpc: npc/re/jobs/3-2/genetic.txt
delnpc: npc/re/jobs/3-2/minstrel.txt
delnpc: npc/re/jobs/3-2/royal_guard.txt
delnpc: npc/re/jobs/3-2/shadow_chaser.txt
delnpc: npc/re/jobs/3-2/sorcerer.txt
delnpc: npc/re/jobs/3-2/sura.txt
delnpc: npc/re/jobs/3-2/wanderer.txt
// - Expanded Super Novice (3rd-job tier)
delnpc: npc/re/jobs/novice/supernovice_ex.txt
// - Doram 4th job (Spirit Handler)
delnpc: npc/re/jobs/doram/spirit_handler.txt
// - Rebirth (ST01 / G10, owner 2026-11-15: no rebirth on this server). npc/jobs/valkyrie.txt holds the Valkyrie
//   rebirth NPC (Valhalla), the Book of Ymir and its Sage Castle librarian (1,285,000z), the Heart of Ymir,
//   the Valkyrie teleporter and the valk01 room warps. Unloaded whole; no other NPC depends on them.
delnpc: npc/jobs/valkyrie.txt
